name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧运行没有价值，直接取消，省 runner 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 是主运行环境；3.12 保留兼容性门禁。
        # 只钉小版本不钉微版本：微版本（如 3.14.6）被 runner 下架时 CI 会直接挂。
        python-version: ["3.14", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints.txt
      # 依赖按 constraints.txt 锁定安装：cvxpy/piqp/clarabel 等求解器升级会改变
      # 数值结果，golden 回测漂移必须表现为对锁文件的显式 diff，而非 CI 静默换版本。
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Ruff
        run: ruff check .
      # 类型门禁：检查范围与唯一豁免（polars stub 的 str-bytes-safe 误报）见
      # pyproject 的 [tool.mypy]。当前零错误，且未使用任何 # type: ignore 兜底。
      - name: Mypy
        run: mypy
      # 覆盖率门禁：阈值 82%（当前约 84%，留 2pct 缓冲）。
      # 统计含 scripts/：数据导出脚本同属交付面，其覆盖缺口应当可见而非排除在外，
      # 因此阈值低于纯 hqopt 时的 85%——这是暴露现状，不是放松要求。
      # 回测/优化的执行语义靠测试守护，覆盖率滑落必须显式暴露而非静默通过。
      - name: Pytest
        run: pytest -q --cov=hqopt --cov=scripts --cov-report=term-missing --cov-fail-under=82
