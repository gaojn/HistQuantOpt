name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14.6 是主运行环境；3.12 保留兼容性门禁。
        python-version: ["3.14.6", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      # 覆盖率门禁：阈值 85%（当前 ~89%，留 4pct 缓冲）。
      # 回测/优化的执行语义靠测试守护，覆盖率滑落必须显式暴露而非静默通过。
      - name: Pytest
        run: pytest -q --cov=hqopt --cov-report=term-missing --cov-fail-under=85
