# ============================================================================
# 量化选股（alpha_max）默认配置
#   全市场选股、最大化 alpha，CNE6 因子风险约束。hqopt run 跑此档。
#   参数依据见 docs/method.md（§4 默认参数、§5 风格约束建议）。
# ============================================================================
strategy: alpha_max
index: all                # 全市场选股

data:
  root: ".."               # 相对本 YAML；wheel 安装后仍使用外部项目数据目录

backtest:
  start_date: "2020-01-01"
  end_date: "2026-05-31"
  rebalance_freq: 10        # 每 10 个交易日换仓一次
  initial_value: 100000000  # 初始资金 1 亿元
  benchmark: equal_weight   # 回测与归因统一使用全市场等权基准

universe:
  exclude_bj: true          # 剔除北交所
  exclude_st: true          # 剔除 ST/*ST
  top_n: null               # 不按市值截断，全市场
  new_listing_days: 120     # 次新股：上市不足此自然日数禁止持仓（list_days < 该值）

optimizer:
  weight_upper: 0.01            # 单票绝对上限 1%
  industry_upper: 0.20          # 单行业绝对上限 20%
  min_constituent_ratio: 0.40   # 沪深300∪中证500∪中证1000 权重下限 40%（保流动性/容量）
  diversification_penalty: 0.05 # L2 分散惩罚 γ（未启用 risk_aversion 时才生效）
  risk_aversion: null           # CNE6 因子协方差进目标（真风险项）；置空则退回上面的 L2 惩罚
  # vol_upper: 0.20             # 年化组合波动率硬上限（20%）。与 risk_aversion 互斥，
  #                             # 启用后目标函数风险项自动关闭；需提供 CNE6 风险面板
  max_turnover: 0.40            # 双边换手硬上限 40%（≈单边 20%）
  turnover_penalty: 0.01        # 换手软惩罚 λ（轻度）
  # 风格绝对暴露上限（CNE6S 20 风格（CNE6L 为 16 风格），单位 σ）：只收紧关键公共风险，其余给 alpha 留表达空间
  style_bound:
    default: 0.50               # 未列出因子的兜底
    Size: 0.20                  # 市值：防小盘下沉
    Beta: 0.20                  # 市场暴露
    Liquidity: 0.20             # 流动性：防低流动性堆积
    ResidualVolatility: 0.20    # 残差波动：防高波动堆积
    Momentum: 0.30              # 动量：中等
    Value: 0.50                 # 价值：偏宽（收益风格）
    Growth: 0.50                # 成长：偏宽（收益风格）
  # cne6_data_dir: data/barra_cne6_L   # 可选：改用长周期 CNE6L 面板（默认短周期 S）

alpha:
  source: file
  synthetic: true            # 文件本身由未来收益构造；终端和产物目录显示提醒，HTML 不加水印
  # ⚠️ 示例为 VWAP5 合成因子（含未来信息，仅跑通流程）；生产请替换为研究员真实 alpha
  path: "alphas/alpha_vwap5_ic0.10_icir0.8_decay0.80.parquet"
  standardize: true          # 优化域内截面 z-score；关掉则 risk_aversion 等系数随因子量纲漂移
  max_staleness_days: 15     # 10交易日换仓约对应15自然日；超限跳过，禁止无限复用旧信号

execution:
  cost_buy: 0.001           # 买入费率 1‰
  cost_sell: 0.002          # 卖出费率 2‰（非对称）
  risk_free: 0.02           # 年化无风险利率（Sharpe 用）

output:
  weights: "output/alpha_max_default/weights.parquet"
