[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HistQuantOpt"
version = "0.1.0"
description = "A-share multi-factor portfolio optimization framework"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pyarrow>=23.0",      # Polars→Pandas / Pandas Parquet 运行时依赖；支持 Python 3.14
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml",
    "cvxpy>=1.4",        # 凸优化（顶层 import hqopt 即需要）
    "clarabel>=0.7",     # CLARABEL solver
    "plotly>=5.0",       # HTML 报告
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
    "black",
]

[project.scripts]
hqopt = "hqopt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hqopt*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
