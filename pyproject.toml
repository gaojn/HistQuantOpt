[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HistQuantOpt"
version = "0.1.0"
description = "A-share multi-factor portfolio optimization framework"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pyarrow>=23.0",      # Polars→Pandas / Pandas Parquet 运行时依赖；支持 Python 3.14
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "pyyaml",
    "cvxpy>=1.4",        # 凸优化（顶层 import hqopt 即需要）
    "clarabel>=0.7",     # CLARABEL solver
    "plotly>=5.0",       # HTML 报告
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",   # CI 覆盖率门禁
    "ruff",
]

[project.scripts]
hqopt = "hqopt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hqopt*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 默认只有 E4/E7/E9/F，漏掉 import 排序与一整类真实 bug（如 zip 长度静默截断）。
select = [
    "E",    # pycodestyle 错误
    "F",    # pyflakes：未使用/未定义名字
    "I",    # isort：import 分组与排序
    "B",    # bugbear：可变默认参数、zip 长度不匹配等真实缺陷
    "UP",   # pyupgrade：过时写法现代化
    "SIM",  # 可简化的分支/上下文管理
    "C4",   # 推导式与容器构造
]
ignore = [
    # 行宽：报告卡片、schema 列表等是刻意空格对齐的表格式代码，且超长部分多为
    # 中文字符——按「字符数」度量对中文并不准确，强行折行是净可读性损失。
    "E501",
    # dict(key=...)：plotly 的 layout/line 惯用写法，改成字面量反而偏离官方示例。
    "C408",
    # StrEnum：OrderState 落盘用的是 .value，换 StrEnum 会改变 str() 行为，
    # 对已发布的 order_states JSON 是无谓风险。
    "UP042",
]

[tool.pytest.ini_options]
pythonpath = ["."]
